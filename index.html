<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語ノート</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="script.js" defer></script>

</head>
<body>
  <header>
    <div class="header-content">
      <h1>日本語ノート</h1>
      <button id="toggle-dark-mode">🌙</button>
    </div>
  </header>

  <main>
    <section id="hero">
      <img src="cover.jpg" alt="主頁圖片">
      <p class="hero-text">日本語の世界へようこそ</p>
      <p class="hero-subtitle">あなたの日本語学習の旅を始めましょう</p>
    </section>

    <section id="content" class="hidden">
      <div class="note-content">
        <div id="lyrics-container"></div>
        <div id="notes-container"></div>
      </div>
      <button id="back-to-homepage" class="back-btn">⬅ ホームへ戻る</button>
    </section>

    <section id="homepage">
      <div class="homepage-layout">
        <div class="left-panel">
          <div class="song-select-panel">
            <h2>ノートを選択</h2>
            <select id="song-select">
              <option value="">ノートを選択してください</option>
            </select>  
          </div>
          <!-- Word Card Ticker -->
          <div class="word-ticker" id="word-ticker">
            <div class="word-card" id="word-card">
              <div class="word-card-content" id="word-card-content">
                <div class="word-japanese" id="word-japanese">単語カード</div>
                <div class="word-chinese" id="word-chinese">Loading words...</div>
                <div class="word-pos" id="word-pos" style="display: none;"></div>
                <div class="word-example" id="word-example" style="display: none;"></div>
                <div class="word-source" id="word-source" style="display: none;"></div>
              </div>
              <div class="word-controls">
                <button class="word-btn next" id="next-word">次へ</button>
                <button class="word-btn toggle" id="toggle-auto">自動: ON</button>
              </div>
              <div class="word-timer" id="word-timer">5s</div>
            </div>
          </div> 
        </div>
        <div class="right-panel">
          <h2>最近のノート</h2>
          <div id="recent-notes" class="note-cards"></div>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>言語の勉強を記録するサイト。日本語が好きだから作りました！</p>
  </footer>

  <audio id="audio-player" controls style="display: none;" controlsList="nodownload"></audio>
</body>
</html>
